<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Elegant Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --text: #e8eaed;
      --muted: #a8adb6;
      --accent: #2a2f3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      scroll-behavior: smooth;
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .home {
      background: radial-gradient(circle at top, #1a1f2a 0%, var(--bg) 55%);
    }

    .open-btn {
      border: 1px solid #323846;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      letter-spacing: 0.02em;
      padding: 0.85rem 2.2rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .open-btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }

    .main {
      display: none;
      align-content: start;
      gap: 2rem;
      text-align: center;
      padding-top: 8vh;
      padding-bottom: 22vh;
    }

    .main.visible {
      display: grid;
    }

    .card {
      width: min(92vw, 560px);
      background: var(--surface);
      border: 1px solid #2d3340;
      border-radius: 18px;
      padding: 2rem;
      margin: 0 auto;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }

    .hero-image {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      border: 1px solid #2f3542;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      display: block;
      margin: 0 auto;
    }

    .note {
      margin-top: 20vh;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .note.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <section id="home" class="screen home">
    <button id="openBtn" class="open-btn">Open</button>
  </section>

  <section id="main" class="screen main">
    <div class="card">
      <h1>Hey Priya</h1>
      <img
        class="hero-image"
        src="https://via.placeholder.com/720x420.png?text=Your+Image+Here"
        alt="Placeholder"
      />
      <p id="note" class="note">
        I hope your day is going well. Take a small pause, breathe, and keep moving at your own pace.
      </p>
    </div>
  </section>

  <script>
    const openBtn = document.getElementById('openBtn');
    const home = document.getElementById('home');
    const main = document.getElementById('main');
    const note = document.getElementById('note');

    openBtn.addEventListener('click', () => {
      home.style.transition = 'opacity 0.45s ease';
      home.style.opacity = '0';

      setTimeout(() => {
        home.style.display = 'none';
        main.classList.add('visible');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 420);
    });

    function revealOnScroll() {
      const rect = note.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      if (rect.top < windowHeight * 0.85) {
        note.classList.add('show');
        window.removeEventListener('scroll', revealOnScroll);
      }
    }

    window.addEventListener('scroll', revealOnScroll);
  </script>
</body>
</html>
